{% extends "base.html" %}
{% block body %}
{% if pending_sync %}<p class="warn">列表待同步</p>{% endif %}
{% if show_submit_hint %}<p class="warn">可提交</p>{% endif %}
{% if can_write %}
<form method="post" action="{{ url_for('create') }}" data-async-submit="1">
  <h2>新开一轮审评</h2>
  <input name="lot" placeholder="批次" required />
  <input name="aroma" type="number" step="0.1" min="0" max="10" placeholder="香气" required />
  <input name="taste" type="number" step="0.1" min="0" max="10" placeholder="滋味" required />
  <input name="liquor" type="number" step="0.1" min="0" max="10" placeholder="汤色" required />
  <button>提交</button>
</form>
{% endif %}
<table>
  <thead>
    <tr>
      <th>批次</th><th>香气</th><th>滋味</th><th>汤色</th>
      <th>加权分</th><th>结论</th><th>说明</th><th></th>
    </tr>
  </thead>
  <tbody id="rows">
    {% for row in rows %}{% include "_row.html" %}{% endfor %}
  </tbody>
</table>
{% endblock %}
